server {
    listen PORT_PLACEHOLDER default_server;
    listen [::]:PORT_PLACEHOLDER default_server;
    server_name _;
    root /var/www/html/public;

    # Crucial: index.php only, so Laravel's router & auth middleware handle all page requests
    index index.php;

    charset utf-8;

    # Logging to stdout & stderr for Render log dashboard
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    client_max_body_size 64M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Health check endpoints for Render (must return 200 without static interception)
    location = /health {
        try_files $uri /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # Redirect raw index.html to / so Laravel handles authentication and session
    location = /index.html {
        return 301 /;
    }

    # Static assets caching
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri =404;
    }

    # Main application routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Pass PHP requests to PHP-FPM daemon
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Pass HTTPS and proxy headers from Render load balancer
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PORT $server_port;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 180s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
