<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>


    # Smaller downloads: compress text assets; keep fonts and pictures in the browser for a long time
    # (CSS and JS are not given a long lifetime: their file names carry no version, so a deploy must reach people at once)
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml
    </IfModule>
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType font/woff2 "access plus 1 year"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
    </IfModule>

    # Disable server tokens and signature for security
    ServerSignature Off

    # Logging directed to stdout/stderr for Docker/Render
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
