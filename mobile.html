<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ruyi Admin - Mobile Bookings</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="standalone-mobile">
  <div id="mobile-app-root"></div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container"></div>

  <script type="module">
    import { createMobileView } from '/src/mobile.js';
    import { INITIAL_BOOKINGS } from '/src/data.js';

    const root = document.getElementById('mobile-app-root');
    const mobileView = createMobileView(root);

    // Check URL parameters: e.g. ?screen=overview, guests, itinerary, menu, assign, assigned
    const urlParams = new URLSearchParams(window.location.search);
    const screen = urlParams.get('screen');
    const trip = INITIAL_BOOKINGS.find(b => b.id === 'BK-5021');

    if (screen === 'overview' || screen === 'customer-details' || screen === 'customer') {
      mobileView.openModal(trip, 'customer-details');
    } else if (screen === 'guests') {
      mobileView.openModal(trip, 'guests');
    } else if (screen === 'itinerary') {
      mobileView.openModal(trip, 'itinerary');
    } else if (screen === 'menu') {
      mobileView.openModal(trip, 'itinerary');
      mobileView.setOpenDropdownItemId('IT-101');
    } else if (screen === 'assign') {
      mobileView.openModal(trip, 'itinerary');
      const raft = trip.itineraryDays?.[1]?.items?.[1];
      mobileView.openAssignSheet(raft);
    } else if (screen === 'assigned') {
      if (trip.itineraryDays?.[0]?.items?.[1]) {
        trip.itineraryDays[0].items[1].assigned = {
          isAssigned: true,
          name: 'Rahul Mehta',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80'
        };
      }
      if (trip.itineraryDays?.[1]?.items?.[1]) {
        trip.itineraryDays[1].items[1].assigned = {
          isAssigned: true,
          name: 'Adventure World',
          avatar: 'https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=120&q=80'
        };
      }
      mobileView.openModal(trip, 'itinerary');
    }
  </script>
</body>
</html>
