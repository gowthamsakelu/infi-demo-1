# Render Blueprint Specification for INFINITY CRM (infi-demo-1)
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: infi-demo-1
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: APP_NAME
        value: "INFINITY"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        generateValue: true

      - key: APP_URL
        value: "https://infi-demo-1-okxz.onrender.com"

      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: sqlite

      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite

      - key: SESSION_DRIVER
        value: file

      - key: CACHE_STORE
        value: file

      - key: QUEUE_CONNECTION
        value: sync

      - key: DEMO_LOGIN
        value: "true"

      - key: DEMO_LOGIN_EMAIL
        value: "sa08gautam23@gmail.com"

      - key: DEMO_LOGIN_NAME
        value: "Gautham"

    # Optional: If you attach a Persistent Disk on Render paid plan:
    # disk:
    #   name: sqlite-data
    #   mountPath: /var/data
    #   sizeGB: 1
