
# Render Infrastructure as Code (Blueprint)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Laravel 12 Backend + Livewire Web Service (Docker)
  # ---------------------------------------------------------------------------
  - type: web
    name: infinity-crm-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /up

    envVars:
      - key: APP_NAME
        value: "INFINITY CRM"

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_KEY
        generateValue: true

      - key: LOG_CHANNEL
        value: stderr

      - key: DB_CONNECTION
        value: sqlite

      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite

      - key: SESSION_DRIVER
        value: database

      - key: CACHE_STORE
        value: database

      - key: QUEUE_CONNECTION
        value: database

  # ---------------------------------------------------------------------------
  # 2. Standalone Frontend Demo (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: infinity-crm-frontend
    runtime: static
    buildCommand: ""
    staticPublishPath: ./frontend

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
